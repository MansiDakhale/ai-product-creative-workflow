version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A api.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=high,normal,low

  celery_flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery_worker
    command: celery -A api.celery_app flower --port=5555

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  redis_data: