services:
  - type: web
    name: ai-product-creative-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Use uvicorn only for initial deploy to avoid spawning a background Celery worker.
    # The app will run workflows inline on Windows / when INLINE_WORKFLOW=1 is set.
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-product-creative-redis
          property: connectionString
      - key: OUTPUT_DIR
        value: ./outputs
      - key: INLINE_WORKFLOW
        value: "1"

  - type: redis
    name: ai-product-creative-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: public access for demo
